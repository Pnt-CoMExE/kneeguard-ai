<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — KneeGuard AI</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .not-found {
      min-height: calc(100vh - var(--nav-h));
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: var(--s7) var(--s5);
    }
    .not-found-inner { max-width: 480px; }
    .not-found-code {
      font-family: var(--font-head); font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 800; color: transparent;
      background: linear-gradient(135deg, var(--brand), #005f7a);
      -webkit-background-clip: text; background-clip: text;
      line-height: 1; margin-bottom: var(--s4);
    }
    .not-found h1 { font-size: var(--fs-2xl); margin-bottom: var(--s4); }
    .not-found p  { color: var(--text-secondary); margin-bottom: var(--s6); }
    .not-found .btn-row { display: flex; gap: var(--s3); justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a class="brand" href="index.html">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 14c3-8 6-10 8-10s5 2 8 10"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
        <span class="brand-text">
          KneeGuard AI
          <span class="brand-sub">Selected Topics · DS &amp; AI</span>
        </span>
      </a>
    </div>
  </header>

  <main>
    <div class="not-found animate-rise">
      <div class="not-found-inner">
        <div class="not-found-code" aria-hidden="true">404</div>
        <h1>Page not found</h1>
        <p>The page you're looking for doesn't exist or may have been moved.</p>
        <div class="btn-row">
          <a class="btn btn-primary" href="index.html">Go to home</a>
          <a class="btn btn-ghost" href="demo.html">Try the demo</a>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>

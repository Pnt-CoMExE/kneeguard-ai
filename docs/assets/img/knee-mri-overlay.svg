<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-label="Knee MRI scan illustration with AI detection overlay">
  <defs>
    <radialGradient id="glow" cx="52%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity=".28"/>
      <stop offset="70%" stop-color="#00b4d8" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e7f2" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#7fb6cb" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#3d6f86" stop-opacity=".55"/>
    </linearGradient>
    <clipPath id="scanClip">
      <rect x="90" y="80" width="460" height="480" rx="18"/>
    </clipPath>
  </defs>

  <!-- Soft ambient glow -->
  <circle cx="330" cy="300" r="250" fill="url(#glow)"/>

  <!-- Outer console frame -->
  <rect x="78" y="68" width="484" height="504" rx="22"
        fill="rgba(8,18,28,.55)" stroke="url(#frame)" stroke-width="2" opacity=".95"/>
  <rect x="90" y="80" width="460" height="480" rx="18"
        fill="rgba(4,12,20,.72)" stroke="rgba(0,180,216,.35)" stroke-width="1"/>

  <!-- Scan viewport -->
  <g clip-path="url(#scanClip)">
    <!-- MRI gray field -->
    <rect x="90" y="80" width="460" height="480" fill="#0a1520"/>
    <circle cx="320" cy="310" r="170" fill="#132433"/>
    <circle cx="320" cy="310" r="128" fill="#1a3142"/>
    <circle cx="320" cy="310" r="88" fill="#243f52"/>

    <!-- Soft tissue rings -->
    <ellipse cx="320" cy="310" rx="145" ry="155" fill="none" stroke="#3d6a80" stroke-width="10" opacity=".45"/>
    <ellipse cx="320" cy="310" rx="110" ry="120" fill="none" stroke="#4f8299" stroke-width="8" opacity=".4"/>

    <!-- Femur (top) -->
    <path d="M268 120
             C280 150, 284 190, 286 230
             C288 255, 290 275, 296 292
             C304 308, 318 316, 320 316
             C322 316, 336 308, 344 292
             C350 275, 352 255, 354 230
             C356 190, 360 150, 372 120
             L350 120
             C342 145, 338 175, 336 210
             C334 235, 332 255, 326 270
             C320 282, 320 282, 320 282
             C320 282, 320 282, 314 270
             C308 255, 306 235, 304 210
             C302 175, 298 145, 290 120 Z"
          fill="url(#bone)" opacity=".9"/>

    <!-- Tibia (bottom) -->
    <path d="M292 340
             C300 355, 306 372, 308 400
             C310 440, 308 480, 304 520
             L336 520
             C332 480, 330 440, 332 400
             C334 372, 340 355, 348 340
             C360 355, 368 375, 372 410
             C376 450, 378 490, 380 540
             L260 540
             C262 490, 264 450, 268 410
             C272 375, 280 355, 292 340 Z"
          fill="url(#bone)" opacity=".88"/>

    <!-- Patella -->
    <ellipse cx="372" cy="286" rx="18" ry="26" fill="#9fd0e0" opacity=".7"/>

    <!-- Meniscus / joint space hint -->
    <path d="M286 318 C300 332, 340 332, 354 318" fill="none" stroke="#5eead4" stroke-width="3" opacity=".55"/>
    <path d="M290 324 C304 336, 336 336, 350 324" fill="none" stroke="#00b4d8" stroke-width="2" opacity=".4"/>

    <!-- ACL hint line -->
    <path d="M312 300 L336 330" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity=".75"/>
    <circle cx="324" cy="315" r="5" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity=".85"/>

    <!-- Scan raster lines -->
    <g opacity=".12" stroke="#7fd4ea" stroke-width="1">
      <line x1="90" y1="140" x2="550" y2="140"/>
      <line x1="90" y1="180" x2="550" y2="180"/>
      <line x1="90" y1="220" x2="550" y2="220"/>
      <line x1="90" y1="260" x2="550" y2="260"/>
      <line x1="90" y1="300" x2="550" y2="300"/>
      <line x1="90" y1="340" x2="550" y2="340"/>
      <line x1="90" y1="380" x2="550" y2="380"/>
      <line x1="90" y1="420" x2="550" y2="420"/>
      <line x1="90" y1="460" x2="550" y2="460"/>
      <line x1="90" y1="500" x2="550" y2="500"/>
    </g>

    <!-- Moving scan beam -->
    <rect x="90" y="250" width="460" height="3" fill="#5eead4" opacity=".55">
      <animate attributeName="y" values="110;520;110" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.65;.2" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Corner brackets -->
  <g stroke="#5eead4" stroke-width="2.5" fill="none" opacity=".9">
    <path d="M108 108h36M108 108v36"/>
    <path d="M532 108h-36M532 108v36"/>
    <path d="M108 532h36M108 532v-36"/>
    <path d="M532 532h-36M532 532v-36"/>
  </g>

  <!-- Detection box around joint -->
  <rect x="268" y="268" width="104" height="72" rx="6"
        fill="none" stroke="#00b4d8" stroke-width="1.8" stroke-dasharray="5 4" opacity=".85">
    <animate attributeName="stroke-opacity" values=".4;.95;.4" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- HUD labels -->
  <g font-family="JetBrains Mono, Consolas, monospace" fill="#7fd4ea">
    <text x="112" y="108" font-size="12" opacity=".75">SAG · PD</text>
    <text x="430" y="108" font-size="12" opacity=".75">AI OVERLAY</text>
    <rect x="380" y="248" width="118" height="44" rx="8" fill="rgba(0,20,32,.75)" stroke="#00b4d8" stroke-width="1"/>
    <text x="392" y="266" font-size="11" fill="#5eead4">ACL · 0.88</text>
    <text x="392" y="282" font-size="10" fill="#fbbf24">HIGH PRIORITY</text>
  </g>

  <!-- Side ticks -->
  <g stroke="#00b4d8" stroke-width="1.5" opacity=".45">
    <line x1="70" y1="220" x2="84" y2="220"/>
    <line x1="70" y1="310" x2="84" y2="310"/>
    <line x1="70" y1="400" x2="84" y2="400"/>
    <line x1="556" y1="220" x2="570" y2="220"/>
    <line x1="556" y1="310" x2="570" y2="310"/>
    <line x1="556" y1="400" x2="570" y2="400"/>
  </g>
</svg>
